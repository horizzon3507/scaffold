<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea7c1c"/>
    </linearGradient>
  </defs>

  <!-- GitHub-dark background -->
  <rect width="1024" height="1024" fill="#0d1117"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- X cross-braces (behind the frame) -->
  <g stroke="#fac764" stroke-width="30" stroke-linecap="round" fill="none">
    <line x1="332" y1="340" x2="692" y2="515"/>
    <line x1="692" y1="340" x2="332" y2="515"/>
    <line x1="332" y1="515" x2="692" y2="690"/>
    <line x1="692" y1="515" x2="332" y2="690"/>
  </g>

  <!-- Scaffold frame -->
  <g stroke="url(#frame)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- vertical standards -->
    <line x1="332" y1="304" x2="332" y2="726"/>
    <line x1="692" y1="304" x2="692" y2="726"/>
    <!-- horizontal ledgers -->
    <line x1="296" y1="340" x2="728" y2="340"/>
    <line x1="296" y1="515" x2="728" y2="515"/>
    <line x1="296" y1="690" x2="728" y2="690"/>
    <!-- base plates -->
    <line x1="298" y1="760" x2="366" y2="760" stroke="#ea7c1c"/>
    <line x1="658" y1="760" x2="726" y2="760" stroke="#ea7c1c"/>
  </g>
</svg>
