[package]
name = "{{name}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "{{Name}}"
authors = ["{{author}}"]
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "{{name}}"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
